version: "3.7"
name: "saveworld"
services:
  redis:
    image: "redis:alpine"
    restart: unless-stopped
    networks:
      - saveworld
  translate_cache:
    build:
      context: "./translate-cache"
      dockerfile: "Dockerfile"
    ports:
      - "8801:3000"
    environment:
      - "REDIS_URL=redis://redis:6379"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - saveworld
networks:
  saveworld:
    name: saveworld
    driver: bridge
